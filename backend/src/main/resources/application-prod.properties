# ============================================
# PRODUCTION PROFILE - application-prod.properties
# Activated with: --spring.profiles.active=prod
# ============================================

# H2 Console STRICTLY OFF in production
spring.h2.console.enabled=false

# Swagger/API docs OFF in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Logging - only errors in production
logging.level.root=ERROR
logging.level.com.apnashehar=WARN
logging.level.org.springframework.security=ERROR
logging.level.org.hibernate.SQL=ERROR

# Actuator - health only, no details exposed
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Stricter session management
server.servlet.session.timeout=30m

# Security headers
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
