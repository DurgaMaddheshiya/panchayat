# Production Configuration for Render

# Server
server.port=${PORT:8080}

# Database - H2 File based (Render mein /data directory persist nahi hoti)
# Production mein MySQL ya PostgreSQL use karo
spring.datasource.url=jdbc:h2:file:./data/panchayat;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console - disable in production
spring.h2.console.enabled=false

# CORS - Render frontend URL allow karo
cors.allowed-origins=${FRONTEND_URL:https://panchayat-app.onrender.com},http://localhost:3000

# Logging - less verbose in production
logging.level.root=WARN
logging.level.com.apnashehar=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Mail - disabled
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
