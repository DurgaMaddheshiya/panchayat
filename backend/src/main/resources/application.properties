# ============================================
# APNA SHEHAR - Application Configuration
# Sensitive values loaded from .env / environment variables
# ============================================

spring.application.name=panchayat
server.port=${PORT:${SERVER_PORT:8080}}

# ---- Admin Seed Credentials (from env - REQUIRED in production) ----
admin.email=${ADMIN_EMAIL:admin@apnashehar.com}
admin.password=${ADMIN_PASSWORD}
admin.fullname=${ADMIN_FULLNAME:System Admin}

# ---- Database Configuration (H2 file-based) ----
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/apnashehar;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 Console - DISABLED (use H2 console only locally by overriding this)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Disable SQL init scripts
spring.sql.init.mode=never

# ---- JPA/Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---- File Upload ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.file-size-threshold=2MB

file.upload-dir=./uploads
file.max-size=10485760

# ---- JWT Configuration (from env) ----
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ---- Mail Configuration (from env) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM}

# ---- Logging (minimal in production) ----
logging.level.root=WARN
logging.level.com.apnashehar=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ---- CORS Configuration (from env) ----
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# ---- Actuator (restricted - only health, no details) ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator

# ---- SpringDoc OpenAPI (disable in production) ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
