services:
  # Backend Service
  - type: web
    name: panchayat-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: FRONTEND_URL
        value: https://panchayat-frontend.onrender.com
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # Frontend Service
  - type: web
    name: panchayat-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        value: https://panchayat-backend.onrender.com
      - key: REACT_APP_NAME
        value: Panchayat
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
