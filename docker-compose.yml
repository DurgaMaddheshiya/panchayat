version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: apna-shehar-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: apna_shehar_db
      MYSQL_USER: apna_shehar_user
      MYSQL_PASSWORD: apna_shehar_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - apna-shehar-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apna-shehar-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/apna_shehar_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: apna_shehar_user
      SPRING_DATASOURCE_PASSWORD: apna_shehar_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: apnashehar2024secretkeymustbe256bitsforhashingsecurity12345678901234567890
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - apna-shehar-network
    volumes:
      - ./uploads:/app/uploads

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apna-shehar-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8080/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - apna-shehar-network

volumes:
  mysql_data:
    driver: local

networks:
  apna-shehar-network:
    driver: bridge