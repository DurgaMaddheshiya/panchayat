services:
  # ── Backend (Spring Boot) ──────────────────────────────────────
  - type: web
    name: panchayat-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # JWT - set these as SECRET in Render dashboard
      - key: JWT_SECRET
        sync: false          # means: set manually in Render dashboard
      - key: JWT_EXPIRATION
        value: 86400000
      - key: JWT_REFRESH_EXPIRATION
        value: 604800000

      # Mail - set these as SECRET in Render dashboard
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

      # Database (H2 file-based - works on free tier)
      - key: DB_URL
        value: jdbc:h2:file:./data/apnashehar;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
      - key: DB_USERNAME
        value: sa
      - key: DB_PASSWORD
        value: ""

      # CORS - frontend URL (Render auto-assigns this name based on service name)
      - key: CORS_ALLOWED_ORIGINS
        value: https://panchayat-frontend.onrender.com

      # Admin seed (set as SECRET in Render dashboard)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULLNAME
        value: System Admin

  # ── Frontend (React) ───────────────────────────────────────────
  - type: web
    name: panchayat-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    plan: free
    envVars:
      - key: REACT_APP_API_URL
        value: https://panchayat-backend.onrender.com
      - key: REACT_APP_APP_NAME
        value: Apna Shehar
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
